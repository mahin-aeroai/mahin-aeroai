name: profile-stats
# Regenerates stats/*.svg for the profile README from the GitHub API.
# Self-hosted replacement for third-party stats servers, which rate-limit or go offline.
on:
  schedule:
    - cron: "17 2 * * *"   # daily, 07:47 IST
  workflow_dispatch:
  push:
    paths:
      - scripts/gen_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}   # optional PAT; adds private-repo commits
        run: python3 scripts/gen_stats.py --user ${{ github.repository_owner }} --out stats
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || (git commit -m "Update profile stats" && git push)
